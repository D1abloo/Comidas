services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    # Aislada: volumen propio + puerto dedicado (default 5433; cloudops usa 5432)
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: bocado
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: bocado
    volumes:
      - bocado_pg:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bocado -d bocado"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        aliases:
          - bocado-postgres

  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bocado:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/bocado
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${DATABASE_SSL_REJECT_UNAUTHORIZED:-true}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
    working_dir: /app
    command: ["node", "/app/scripts/migrate-db.mjs"]
    restart: "no"
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      DATABASE_URL: postgres://bocado:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/bocado
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      ORDER_TOKEN_SECRET: ${ORDER_TOKEN_SECRET:?ORDER_TOKEN_SECRET is required}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
      ALLOW_ADMIN_REGISTRATION: ${ALLOW_ADMIN_REGISTRATION:-false}
      APP_DEMO_MODE: "false"
      ENABLE_SIMULATED_PAYMENTS: "false"
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-BocadO <pedidos@bocado.app>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      BIZUM_COMPANY_PHONE: ${BIZUM_COMPANY_PHONE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:4321:4321"
    volumes:
      - bocado_uploads:/app/apps/web/dist/client/uploads
    security_opt:
      - no-new-privileges:true

volumes:
  bocado_pg:
  bocado_uploads:
